```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Placement Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Placement<span>Portal</span></div>
    <a href="index.html" class="nav-btn">Home</a>
</header>

<section class="register-page">

    <div class="register-box">

        <div class="register-heading">
            <div class="login-icon">🎓</div>
            <p class="small-title">STUDENT PORTAL</p>
            <h1>Create Your Account</h1>
            <p>Register yourself to access placement opportunities.</p>
        </div>

        <form onsubmit="registerStudent(event)">

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" placeholder="Enter full name" required>
                </div>

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="regStudentId" placeholder="Enter Student ID" required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label>Course</label>
                    <select id="regCourse" required>
                        <option value="">Select Course</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="MCA">MCA</option>
                        <option value="MBA">MBA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Branch</label>
                    <input type="text" id="regBranch" placeholder="Enter branch" required>
                </div>

                <div class="form-group">
                    <label>Semester</label>
                    <select id="regSemester" required>
                        <option value="">Select Semester</option>
                        <option value="1st Semester">1st Semester</option>
                        <option value="2nd Semester">2nd Semester</option>
                        <option value="3rd Semester">3rd Semester</option>
                        <option value="4th Semester">4th Semester</option>
                        <option value="5th Semester">5th Semester</option>
                        <option value="6th Semester">6th Semester</option>
                        <option value="7th Semester">7th Semester</option>
                        <option value="8th Semester">8th Semester</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>CGPA</label>
                    <input type="number" id="regCgpa" placeholder="Enter CGPA" min="0" max="10" step="0.01" required>
                </div>

                <div class="form-group full-width">
                    <label>Skills</label>
                    <input type="text" id="regSkills" placeholder="Example: Python, Java, SQL, HTML, CSS" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create password" minlength="5" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm password" minlength="5" required>
                </div>

                <div class="form-group full-width">
                    <label>Upload Resume</label>
                    <input type="file" id="regResume" accept=".pdf,.doc,.docx" required>
                    <small>Accepted formats: PDF, DOC, DOCX</small>
                </div>

            </div>

            <label class="checkbox">
                <input type="checkbox" id="terms" required>
                I confirm that the information provided by me is correct.
            </label>

            <button type="submit" class="register-btn">
                Create Student Account
            </button>

        </form>

        <p class="already-account">
            Already have an account?
            <a href="student-login.html">Login Here</a>
        </p>

        <a href="index.html" class="back-link">← Back to Home</a>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
```
