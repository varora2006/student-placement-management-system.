<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Times New Roman",serif;
    background:linear-gradient(135deg,#10152f,#24305b,#50255f,#142c46);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    overflow:hidden;
    color:white;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(5px);
    opacity:.35;
    animation:float 7s ease-in-out infinite;
}

.one{
    width:270px;
    height:270px;
    background:#00d4ff;
    top:-90px;
    left:-80px;
}

.two{
    width:310px;
    height:310px;
    background:#bd4cff;
    bottom:-120px;
    right:-80px;
    animation-delay:2s;
}

.three{
    width:150px;
    height:150px;
    background:#42ffb0;
    top:45%;
    right:12%;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(25px,-25px) scale(1.1)}
}

nav{
    height:78px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:5;
    background:rgba(0,0,0,.12);
    border-bottom:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
}

.logo{
    font-family:Algerian,"Times New Roman",serif;
    font-size:24px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:25px;
    transition:.3s;
}

.back:hover{
    background:white;
    color:#18264a;
    transform:translateY(-2px);
}

.container{
    min-height:calc(100vh - 78px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
    position:relative;
    z-index:2;
}

.card{
    width:430px;
    max-width:100%;
    padding:42px 38px;
    border-radius:28px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 25px 70px rgba(0,0,0,.35);
    backdrop-filter:blur(22px);
    animation:cardFly 1s ease forwards;
    opacity:0;
    transform:translateY(80px) scale(.94);
}

@keyframes cardFly{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.icon{
    width:82px;
    height:82px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    background:linear-gradient(135deg,#00d4ff,#a34de5);
    box-shadow:0 10px 35px rgba(0,212,255,.25);
    animation:iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

h1{
    text-align:center;
    font-family:Algerian,"Times New Roman",serif;
    font-size:30px;
    font-weight:bold;
    animation:titleSlide 1s ease .2s forwards;
    opacity:0;
    transform:translateX(-40px);
}

@keyframes titleSlide{
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.subtitle{
    text-align:center;
    margin:12px 0 30px;
    font-size:17px;
    color:#e5eaff;
    animation:fadeUp 1s ease .4s forwards;
    opacity:0;
    transform:translateY(20px);
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.field{
    margin-bottom:20px;
    animation:fieldSlide .8s ease forwards;
    opacity:0;
    transform:translateX(-35px);
}

.field:nth-child(1){animation-delay:.55s}
.field:nth-child(2){animation-delay:.7s}

@keyframes fieldSlide{
    to{
        opacity:1;
        transform:translateX(0);
    }
}

label{
    display:block;
    margin-bottom:8px;
    font-size:16px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px 16px;
    border:none;
    outline:none;
    border-radius:14px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.25);
    color:white;
    font-family:"Times New Roman",serif;
    font-size:16px;
    transition:.3s;
}

input::placeholder{
    color:#d6d9e5;
}

input:focus{
    border-color:#00d4ff;
    box-shadow:0 0 20px rgba(0,212,255,.22);
    transform:translateY(-2px);
}

.login-btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:15px;
    color:white;
    background:linear-gradient(90deg,#00aeea,#9245dc);
    font-family:"Times New Roman",serif;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.35s;
    animation:buttonUp 1s ease .9s forwards;
    opacity:0;
    transform:translateY(25px);
}

@keyframes buttonUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.login-btn:hover{
    transform:translateY(-4px) scale(1.02);
    box-shadow:0 18px 35px rgba(0,174,234,.35);
}

.demo{
    margin-top:24px;
    padding:13px;
    border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.13);
    text-align:center;
    font-size:14px;
    color:#e5eaff;
    animation:fadeUp 1s ease 1.1s forwards;
    opacity:0;
}

.demo strong{
    color:#66e6ff;
}

.message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
    min-height:20px;
}

@media(max-width:600px){

    nav{
        padding:0 20px;
    }

    .logo{
        font-size:18px;
    }

    .back{
        padding:8px 14px;
        font-size:14px;
    }

    .container{
        padding:20px;
    }

    .card{
        padding:32px 24px;
    }

    h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<nav>

    <div class="logo">
        STUDENT PLACEMENT SYSTEM
    </div>

    <a href="index.html" class="back">
        ← HOME
    </a>

</nav>

<div class="container">

    <div class="card">

        <div class="icon">
            👑
        </div>

        <h1>
            ADMIN LOGIN
        </h1>

        <p class="subtitle">
            CONTROL AND MONITOR THE COMPLETE PLACEMENT SYSTEM
        </p>

        <form onsubmit="adminLogin(event)">

            <div class="field">

                <label>
                    ADMIN ID
                </label>

                <input
                    type="text"
                    id="adminId"
                    placeholder="ENTER ADMIN ID"
                    required
                >

            </div>

            <div class="field">

                <label>
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="ENTER PASSWORD"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                LOGIN AS ADMIN
            </button>

        </form>

        <div
            class="message"
            id="message"
        ></div>

        <div class="demo">

            DEMO ID:
            <strong>ADM1001</strong>

            &nbsp; | &nbsp;

            PASSWORD:
            <strong>12345</strong>

        </div>

    </div>

</div>

<script>

function adminLogin(event){

    event.preventDefault();

    const id =
        document.getElementById("adminId").value.trim();

    const password =
        document.getElementById("adminPassword").value.trim();

    const message =
        document.getElementById("message");

    if(
        id === "ADM1001" &&
        password === "12345"
    ){

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        localStorage.setItem(
            "adminId",
            id
        );

        message.style.color =
            "#6dffbd";

        message.innerText =
            "LOGIN SUCCESSFUL...";

        setTimeout(function(){

            window.location.href =
                "admin.html";

        },800);

    }else{

        message.style.color =
            "#ff9b9b";

        message.innerText =
            "INVALID ADMIN ID OR PASSWORD";

    }

}

</script>

</body>
</html>
